services:
  litellm:
    # Fijado al digest en uso el 2026-08-07 (era :main-latest). Para
    # actualizar: docker pull ghcr.io/berriai/litellm:main-latest && docker
    # inspect --format '{{index .RepoDigests 0}}' ghcr.io/berriai/litellm:main-latest
    image: ghcr.io/berriai/litellm@sha256:a049fb12c8737ada1a7d8c1185fa589c226d7846c1f45192fdbb6c03e8f83ba5
    container_name: litellm
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
