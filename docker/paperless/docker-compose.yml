services:
  broker:
    # Fijado al digest en uso el 2026-08-09 (era :7). Para actualizar:
    #   docker pull docker.io/library/redis:7
    #   docker inspect --format "{{index .RepoDigests 0}}" docker.io/library/redis:7
    # y sustituye el digest de abajo por el que devuelva ese comando.
    image: docker.io/library/redis@sha256:595cc6f2bb3af6e03347b90deb6123c6aa2c81dea05ce08128de8a174b6ac67b
    restart: unless-stopped
    volumes:
      - redisdata:/data

  db:
    # Fijado al digest en uso el 2026-08-09 (era :16). Para actualizar:
    #   docker pull docker.io/library/postgres:16
    #   docker inspect --format "{{index .RepoDigests 0}}" docker.io/library/postgres:16
    # y sustituye el digest de abajo por el que devuelva ese comando.
    image: docker.io/library/postgres@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  gotenberg:
    # Fijado al digest en uso el 2026-08-09 (era :8). Para actualizar:
    #   docker pull docker.io/gotenberg/gotenberg:8
    #   docker inspect --format "{{index .RepoDigests 0}}" docker.io/gotenberg/gotenberg:8
    # y sustituye el digest de abajo por el que devuelva ese comando.
    image: docker.io/gotenberg/gotenberg@sha256:67097317623a503ba2a6a7e9ae8db6929a1f7e1bbd88077bacf2d325fbdab923
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-routes=true"

  tika:
    # Fijado al digest en uso el 2026-08-07 (era :latest). Para actualizar:
    #   docker pull docker.io/apache/tika:latest
    #   docker inspect --format "{{index .RepoDigests 0}}" docker.io/apache/tika:latest
    # y sustituye el digest de abajo por el que devuelva ese comando.
    image: docker.io/apache/tika@sha256:90b7fa1dc018434075fce9e1d9b88b1e3d0ea6979d0cf86e116c79a8073ae973
    restart: unless-stopped

  webserver:
    # Fijado al digest en uso el 2026-08-07 (era :latest). Para actualizar:
    #   docker pull docker.io/paperlessngx/paperless-ngx:latest
    #   docker inspect --format "{{index .RepoDigests 0}}" docker.io/paperlessngx/paperless-ngx:latest
    # y sustituye el digest de abajo por el que devuelva ese comando.
    image: docker.io/paperlessngx/paperless-ngx@sha256:17312f00bac06f8dad09d67c6c8c069fc5c076c0c22313241c673102dfaf8ee9
    restart: unless-stopped
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
    ports:
      - "8010:8000"
    volumes:
      - ./data:/usr/src/paperless/data
      - ./media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_OCR_LANGUAGE: spa
      PAPERLESS_OCR_MODE: force
      PAPERLESS_OCR_USER_ARGS: '{"oversample": 400}'
      PAPERLESS_TIME_ZONE: Europe/Madrid
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_URL: http://localhost:8010


  paperless-aissist:
    # Fijado al digest en uso el 2026-08-09 (era :latest). Para actualizar:
    #   docker pull nyxtronlab/paperless-aissist:latest
    #   docker inspect --format "{{index .RepoDigests 0}}" nyxtronlab/paperless-aissist:latest
    # y sustituye el digest de abajo por el que devuelva ese comando.
    image: nyxtronlab/paperless-aissist@sha256:2436e4ca8f2dcfe51aa78315d42670efd7a5459977fc77f4acac3de6e6253bf4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8011:8080"
    volumes:
      - aissist_data:/app/data
volumes:
  pgdata:
  redisdata:

  aissist_data:
