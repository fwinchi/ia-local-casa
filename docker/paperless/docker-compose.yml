services:
  broker:
    image: docker.io/library/redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data

  db:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-routes=true"

  tika:
    # Fijado al digest en uso el 2026-08-07 (era :latest). Para actualizar:
    #   docker pull docker.io/apache/tika:latest
    #   docker inspect --format "{{index .RepoDigests 0}}" docker.io/apache/tika:latest
    # y sustituye el digest de abajo por el que devuelva ese comando.
    image: docker.io/apache/tika@sha256:90b7fa1dc018434075fce9e1d9b88b1e3d0ea6979d0cf86e116c79a8073ae973
    restart: unless-stopped

  webserver:
    # Fijado al digest en uso el 2026-08-07 (era :latest). Para actualizar:
    #   docker pull docker.io/paperlessngx/paperless-ngx:latest
    #   docker inspect --format "{{index .RepoDigests 0}}" docker.io/paperlessngx/paperless-ngx:latest
    # y sustituye el digest de abajo por el que devuelva ese comando.
    image: docker.io/paperlessngx/paperless-ngx@sha256:17312f00bac06f8dad09d67c6c8c069fc5c076c0c22313241c673102dfaf8ee9
    restart: unless-stopped
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
    ports:
      - "8010:8000"
    volumes:
      - ./data:/usr/src/paperless/data
      - ./media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${POSTGRES_PASSWORD}
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_OCR_LANGUAGE: spa
      PAPERLESS_OCR_MODE: force
      PAPERLESS_OCR_USER_ARGS: '{"oversample": 400}'
      PAPERLESS_TIME_ZONE: Europe/Madrid
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_URL: http://localhost:8010


  paperless-aissist:
    image: nyxtronlab/paperless-aissist
    restart: unless-stopped
    ports:
      - "127.0.0.1:8011:8080"
    volumes:
      - aissist_data:/app/data
volumes:
  pgdata:
  redisdata:

  aissist_data:
